<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Thông Tin Sở Thích</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form-container {
            background-color: #ffffff;
            border: 2px solid #bce3f0;
            border-radius: 8px;
            width: 450px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .form-header {
            background-color: #e57333;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .form-body {
            padding: 20px 30px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        .form-control {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .hobbies-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 5px;
        }

        .hobby-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #333;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            gap: 15px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }

        .btn-submit {
            background-color: #3f729b;
        }

        .btn-submit:hover {
            background-color: #325c7e;
        }

        .btn-reset {
            background-color: #e74c3c;
        }

        .btn-reset:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <!-- Tiêu đề form -->
        <div class="form-header">
            SỞ THÍCH CỦA BẠN
        </div>

        <!-- Nội dung form -->
        <div class="form-body">
            <form action="#" method="POST">
                <!-- Họ và tên -->
                <div class="form-group">
                    <label for="fullname">Họ và tên:</label>
                    <input type="text" id="fullname" name="fullname" class="form-control" placeholder="Nhập họ và tên...">
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Nhập email...">
                </div>

                <!-- Sở thích (Checkbox) -->
                <div class="form-group">
                    <label>Sở thích:</label>
                    <div class="hobbies-grid">
                        <div class="hobby-item">
                            <input type="checkbox" id="the-thao" name="hobbies" value="the-thao">
                            <label for="the-thao">Thể thao</label>
                        </div>
                        <div class="hobby-item">
                            <input type="checkbox" id="am-nhac" name="hobbies" value="am-nhac">
                            <label for="am-nhac">Âm nhạc</label>
                        </div>
                        <div class="hobby-item">
                            <input type="checkbox" id="doc-sach" name="hobbies" value="doc-sach">
                            <label for="doc-sach">Đọc sách</label>
                        </div>
                        <div class="hobby-item">
                            <input type="checkbox" id="luot-web" name="hobbies" value="luot-web">
                            <label for="luot-web">Lướt web</label>
                        </div>
                        <div class="hobby-item">
                            <input type="checkbox" id="choi-game" name="hobbies" value="choi-game">
                            <label for="choi-game">Chơi game</label>
                        </div>
                        <div class="hobby-item">
                            <input type="checkbox" id="dien-anh" name="hobbies" value="dien-anh">
                            <label for="dien-anh">Điện ảnh</label>
                        </div>
                        <div class="hobby-item">
                            <input type="checkbox" id="du-lich" name="hobbies" value="du-lich">
                            <label for="du-lich">Du lịch</label>
                        </div>
                    </div>
                </div>

                <!-- Nút bấm chức năng -->
                <div class="form-actions">
                    <button type="submit" class="btn btn-submit">Gửi thông tin</button>
                    <button type="reset" class="btn btn-reset">Nhập lại</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
