<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table sử dụng thuộc tính colspan</title>
</head>
<body>
    <table border="1" cellspacing="10" cellpadding="10">
        <thead>
            <tr>
                <th>Tháng</th>
                <th colspan="2">Tỉ lệ đơn hàng theo tháng</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Nguyễn Văn A</td>
                <td>15% hoàn thành</td>
                <td>85% hủy hàng</td>
            </tr>
            <tr>
                <td>Trần Thị B</td>
                <td>20% hoàn thành</td>
                <td>80% hủy hàng</td>
            </tr>
            <tr>
                <td> Lê Văn C</td>
                <td>25% hoàn thành</td>
                <td>75% hủy hàng</td>
            </tr>

        </tbody>

    </table>
</body>
</html>
